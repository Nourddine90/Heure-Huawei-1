<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <title>ساعة HUAWEI الذكية</title>
    
    <!-- إعدادات PWA -->
    <meta name="theme-color" content="#ff0000">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="https://cdn.jsdelivr.net/npm/twemoji@14.0.2/assets/svg/1f552.svg">
    
    <!-- لأجهزة iOS -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="HUAWEI Clock">
    
    <!-- لأجهزة Android -->
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="application-name" content="HUAWEI Clock">
    
    <style>
        body {
            background: black;
            color: white;
            text-align: center;
            padding: 20px;
            font-family: Arial;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }
        h1 {
            color: red;
            font-size: 50px;
            margin: 20px;
        }
        #clock {
            font-size: 80px;
            color: cyan;
            margin: 30px;
            text-shadow: 0 0 20px cyan;
            direction: ltr;
        }
        .date {
            font-size: 25px;
            color: gold;
            margin: 20px;
        }
        .footer {
            color: #888;
            margin-top: 40px;
        }
        
        /* زر التثبيت */
        .install-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #ff0000;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 25px;
            font-size: 14px;
            cursor: pointer;
            z-index: 1000;
            box-shadow: 0 4px 15px rgba(255,0,0,0.4);
            display: none;
        }
        
        @media (max-width: 600px) {
            #clock { font-size: 60px; }
            h1 { font-size: 40px; }
        }
    </style>
</head>
<body>
    <h1>HUAWEI ⌚</h1>
    <div id="clock">00:00:00</div>
    <div class="date" id="date">السبت ١ يناير ٢٠٢٤</div>
    
    <div class="footer">
        تطوير ساعة HUAWEI الرقمية<br>
        يعمل على جميع الأجهزة
    </div>
    
    <!-- زر التثبيت -->
    <button id="installButton" class="install-btn">📲 تثبيت التطبيق</button>

    <script>
        // دالة تحديث الوقت
        function updateTime() {
            var now = new Date();
            
            // الوقت
            var hours = now.getHours();
            var minutes = now.getMinutes();
            var seconds = now.getSeconds();
            
            // إضافة صفر إذا كان أقل من 10
            if (hours < 10) hours = '0' + hours;
            if (minutes < 10) minutes = '0' + minutes;
            if (seconds < 10) seconds = '0' + seconds;
            
            document.getElementById('clock').innerHTML = 
                hours + ':' + minutes + ':' + seconds;
            
            // التاريخ العربي
            var options = { 
                weekday: 'long', 
                year: 'numeric', 
                month: 'long', 
                day: 'numeric' 
            };
            document.getElementById('date').innerHTML = 
                now.toLocaleDateString('ar-SA', options);
        }
        
        setInterval(updateTime, 1000);
        updateTime();
        
        // كود PWA
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', function() {
                navigator.serviceWorker.register('sw.js')
                    .then(function(registration) {
                        console.log('ServiceWorker registered');
                    })
                    .catch(function(err) {
                        console.log('ServiceWorker failed: ', err);
                    });
            });
        }
        
        // التثبيت على الهاتف
        let deferredPrompt;
        const installButton = document.getElementById('installButton');
        
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            
            // إظهار زر التثبيت
            installButton.style.display = 'block';
            
            installButton.addEventListener('click', () => {
                installButton.style.display = 'none';
                deferredPrompt.prompt();
                
                deferredPrompt.userChoice.then((choiceResult) => {
                    if (choiceResult.outcome === 'accepted') {
                        console.log('تم تثبيت التطبيق');
                    }
                    deferredPrompt = null;
                });
            });
        });
        
        // إخفاء الزر إذا كان التطبيق مثبتاً
        window.addEventListener('appinstalled', () => {
            installButton.style.display = 'none';
        });
        
        // التحقق إذا كان التطبيق مثبتاً بالفعل
        if (window.matchMedia('(display-mode: standalone)').matches) {
            installButton.style.display = 'none';
        }
    </script>
</body>
</html>
