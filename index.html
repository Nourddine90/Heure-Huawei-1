<!DOCTYPE html>
<html lang="ar">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <title>ساعة هواوي - الساعة الرقمية الذكية</title>
    <meta name="description" content="ساعة رقمية ذكية بتصميم HUAWEI الأنيق، تعرض الوقت والتاريخ الهجري والميلادي مع ألوان متغيرة حسب الوقت.">
    <meta name="keywords" content="ساعة, هواوي, وقت, تاريخ, هجري, ميلادي, رقمية">
    <meta name="author" content="Nourddine90">
    <meta name="theme-color" content="#ff0000">
    
    <!-- Open Graph -->
    <meta property="og:title" content="ساعة هواوي الرقمية">
    <meta property="og:description" content="ساعة رقمية أنيقة تعرض الوقت والتاريخ بتصميم HUAWEI">
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://nourddine90.github.io/huawei-clock/">
    <meta property="og:image" content="https://img.icons8.com/color/512/clock--v1.png">
    
    <!-- أيقونة الموقع -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90' fill='red'>⏰</text></svg>">
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            background: #000;
            color: white;
            text-align: center;
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            background: linear-gradient(135deg, #0a0a0a, #1a1a1a);
        }
        
        .header {
            color: #ff0000;
            font-size: 48px;
            font-weight: bold;
            margin-bottom: 30px;
            text-shadow: 0 0 20px rgba(255, 0, 0, 0.7);
            animation: glow 2s infinite alternate;
        }
        
        @keyframes glow {
            from { text-shadow: 0 0 20px rgba(255, 0, 0, 0.7); }
            to { text-shadow: 0 0 30px rgba(255, 0, 0, 0.9); }
        }
        
        .clock-container {
            background: rgba(255, 255, 255, 0.05);
            border-radius: 20px;
            padding: 40px 30px;
            margin: 20px;
            border: 2px solid rgba(255, 0, 0, 0.3);
            box-shadow: 0 10px 40px rgba(255, 0, 0, 0.2);
            max-width: 800px;
            width: 90%;
        }
        
        #time {
            font-size: 72px;
            color: #00ffff;
            font-weight: bold;
            text-shadow: 0 0 25px rgba(0, 255, 255, 0.8);
            direction: ltr;
            letter-spacing: 3px;
            margin: 20px 0;
            transition: color 0.5s;
        }
        
        #date {
            font-size: 24px;
            color: #ffcc00;
            margin: 20px 0;
            line-height: 1.5;
        }
        
        .features {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 40px;
        }
        
        .feature {
            background: rgba(255, 255, 255, 0.08);
            padding: 15px 25px;
            border-radius: 10px;
            min-width: 150px;
        }
        
        .feature h3 {
            color: #4df0ff;
            margin-bottom: 8px;
            font-size: 16px;
        }
        
        .footer {
            color: rgba(255, 255, 255, 0.6);
            margin-top: 50px;
            font-size: 14px;
            text-align: center;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            width: 100%;
            max-width: 800px;
        }
        
        @media (max-width: 768px) {
            .header { font-size: 36px; }
            #time { font-size: 56px; }
            .clock-container { padding: 30px 20px; }
        }
        
        @media (max-width: 480px) {
            #time { font-size: 42px; }
            .header { font-size: 28px; }
            .features { flex-direction: column; }
            .feature { min-width: auto; }
        }
    </style>
</head>
<body>
    <header role="banner">
        <h1 class="header">HUAWEI ⏰</h1>
    </header>
    
    <main role="main">
        <div class="clock-container" role="timer" aria-label="الساعة الرقمية">
            <div id="time" role="text" aria-live="polite">00:00:00</div>
            <div id="date" role="text">جاري التحميل...</div>
            
            <div class="features">
                <div class="feature">
                    <h3>🕐 الوقت الحالي</h3>
                    <div>يتحدد كل ثانية</div>
                </div>
                <div class="feature">
                    <h3>📅 التاريخ</h3>
                    <div>هجري/ميلادي</div>
                </div>
                <div class="feature">
                    <h3>📱 التصميم</h3>
                    <div>متجاوب مع جميع الشاشات</div>
                </div>
            </div>
        </div>
    </main>
    
    <footer role="contentinfo" class="footer">
        <p>✨ ساعة HUAWEI الرقمية المتطورة ✨</p>
        <p>تم التطوير باستخدام HTML5, CSS3 & JavaScript</p>
        <p>يعمل على جميع الأجهزة والمتصفحات</p>
    </footer>

    <script>
        function updateTime() {
            const now = new Date();
            
            let hours = now.getHours();
            let minutes = now.getMinutes();
            let seconds = now.getSeconds();
            
            hours = hours < 10 ? '0' + hours : hours;
            minutes = minutes < 10 ? '0' + minutes : minutes;
            seconds = seconds < 10 ? '0' + seconds : seconds;
            
            document.getElementById('time').textContent = 
                `${hours}:${minutes}:${seconds}`;
            
            const dateOptions = {
                weekday: 'long',
                year: 'numeric',
                month: 'long',
                day: 'numeric'
            };
            document.getElementById('date').textContent = 
                now.toLocaleDateString('ar-SA', dateOptions);
            
            const timeElement = document.getElementById('time');
            const hour = parseInt(hours);
            
            if (hour < 6) {
                timeElement.style.color = '#ff66ff';
                timeElement.style.textShadow = '0 0 25px #ff66ff';
            } else if (hour < 12) {
                timeElement.style.color = '#ff9900';
                timeElement.style.textShadow = '0 0 25px #ff9900';
            } else if (hour < 17) {
                timeElement.style.color = '#00ffaa';
                timeElement.style.textShadow = '0 0 25px #00ffaa';
            } else if (hour < 20) {
                timeElement.style.color = '#00aaff';
                timeElement.style.textShadow = '0 0 25px #00aaff';
            } else {
                timeElement.style.color = '#aa66ff';
                timeElement.style.textShadow = '0 0 25px #aa66ff';
            }
        }
        
        setInterval(updateTime, 1000);
        updateTime();
    </script>
</body>
</html>
